<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>ARRRGH!</title>
  </head>
  <body>
    <input
      id="gain1"
      type="range"
      min="0"
      max="1"
      step="0.001"
      value="0.0"
    /><label id="gainDisplay1">GainLevel_1</label>
    <input
      id="gain2"
      type="range"
      min="0"
      max="1"
      step="0.001"
      value="0.0"
    /><label id="gainDisplay2">GainLevel_2</label>
    <input
      id="gain3"
      type="range"
      min="0"
      max="1"
      step="0.001"
      value="0.0"
    /><label id="gainDisplay3">GainLevel_3</label>
    <input
      id="gain4"
      type="range"
      min="0"
      max="1"
      step="0.001"
      value="0.0"
    /><label id="gainDisplay4">GainLevel_4</label>

    <input
      id="freq1"
      type="range"
      min="60"
      max="240"
      step="0.001"
      value="60.0"
    /><label id="freqDisplay1">Frequency_1</label>
    <input
      id="freq2"
      type="range"
      min="120"
      max="480"
      step="0.001"
      value="120.0"
    /><label id="freqDisplay2">Frequency_2</label>
    <input
      id="freq3"
      type="range"
      min="240"
      max="960"
      step="0.001"
      value="240.0"
    /><label id="freqDisplay3">Frequency_3</label>
    <input
      id="freq4"
      type="range"
      min="480"
      max="1920"
      step="0.001"
      value="480.0"
      ,
    /><label id="freqDisplay4">Frequency_4</label>

    <script>
      const ctx = new AudioContext();
      ctx.suspend();

      const gain1 = new GainNode(ctx);
      gain1.gain.value = 0.0;

      let freq1 = 60.0;
      const osc1 = new OscillatorNode(ctx);
      osc1.frequency.value = freq1;
      const osc2 = new OscillatorNode(ctx);
      osc2.frequency.value = freq1 * 1.01;
      const osc3 = new OscillatorNode(ctx);
      osc3.frequency.value = freq1 * 0.99;

      osc1.connect(gain1);
      osc2.connect(gain1);
      osc3.connect(gain1);
      gain1.connect(ctx.destination);
      osc1.start();
      osc2.start();
      osc3.start();

      const slider1 = document.querySelector("#gain1");
      slider1.addEventListener("input", () => {
        ctx.resume();
        gain1.gain.value = Number(slider1.value);
        document.querySelector("#gainDisplay1").textContent = slider1.value;
      });

      const freqSlider1 = document.querySelector("#freq1");
      freqSlider1.addEventListener("input", () => {
        ctx.resume();
        freq1 = Number(freqSlider1.value);
        osc1.frequency.value = freq1;
        osc2.frequency.value = freq1 * 1.01;
        osc3.frequency.value = freq1 * 0.99;
        document.querySelector("#freqDisplay1").textContent = freqSlider1.value;
      });
      let freq2 = 120.0;
      const osc4 = new OscillatorNode(ctx);
      const osc5 = new OscillatorNode(ctx);
      const osc6 = new OscillatorNode(ctx);

      const gain2 = new GainNode(ctx);
      gain2.gain.value = 0.0;

      osc4.connect(gain2);
      osc5.connect(gain2);
      osc6.connect(gain2);
      gain2.connect(ctx.destination);
      osc4.start();
      osc5.start();
      osc6.start();

      const slider2 = document.querySelector("#gain2");
      slider2.addEventListener("input", () => {
        ctx.resume();
        gain2.gain.value = Number(slider2.value);
        document.querySelector("#gainDisplay2").textContent = slider2.value;
      });

      const freqSlider2 = document.querySelector("#freq2");
      freqSlider2.addEventListener("input", () => {
        ctx.resume();
        freq2 = Number(freqSlider2.value);
        osc4.frequency.value = freq2;
        osc5.frequency.value = freq2 * 0.01;
        osc6.frequency.value = freq2 * 0.1;
        document.querySelector("#freqDisplay2").textContent = freqSlider2.value;
      });

      let freq3 = 180.0;
      const osc7 = new OscillatorNode(ctx);
      const osc8 = new OscillatorNode(ctx);
      const osc9 = new OscillatorNode(ctx);

      const gain3 = new GainNode(ctx);
      gain3.gain.value = 0.0;

      osc7.connect(gain3);
      osc8.connect(gain3);
      osc9.connect(gain3);
      gain3.connect(ctx.destination);
      osc7.start();
      osc8.start();
      osc9.start();

      const slider3 = document.querySelector("#gain3");
      slider3.addEventListener("input", () => {
        ctx.resume();
        gain3.gain.value = Number(slider3.value);
        document.querySelector("#gainDisplay3").textContent = slider3.value;
      });

      const freqSlider3 = document.querySelector("#freq3");
      freqSlider3.addEventListener("input", () => {
        ctx.resume();
        freq3 = Number(freqSlider3.value);
        osc7.frequency.value = freq3;
        osc8.frequency.value = freq3 * 0.2;
        osc9.frequency.value = freq3 * 0.03;
        document.querySelector("#freqDisplay3").textContent = freqSlider3.value;
      });

      let freq4 = 240.0;
      const osc10 = new OscillatorNode(ctx);
      const osc11 = new OscillatorNode(ctx);
      const osc12 = new OscillatorNode(ctx);

      const gain4 = new GainNode(ctx);
      gain4.gain.value = 0.0;

      osc10.connect(gain4);
      osc11.connect(gain4);
      osc12.connect(gain4);
      gain4.connect(ctx.destination);
      osc10.start();
      osc11.start();
      osc12.start();

      const slider4 = document.querySelector("#gain4");
      slider4.addEventListener("input", () => {
        ctx.resume();
        gain4.gain.value = Number(slider4.value);
        document.querySelector("#gainDisplay4").textContent = slider4.value;
      });

      const freqSlider4 = document.querySelector("#freq4");
      freqSlider4.addEventListener("input", () => {
        ctx.resume();
        freq4 = Number(freqSlider4.value);
        osc10.frequency.value = freq4;
        osc11.frequency.value = freq4 * 0.23;
        osc12.frequency.value = freq4 * 0.19;
        document.querySelector("#freqDisplay4").textContent = freqSlider4.value;
      });
    </script>
  </body>
</html>
